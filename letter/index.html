<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f2ecdf">
<title>文献 · Letter — Lymochi</title>
<meta name="description" content="Lymochi 的文献阅读室：论文的中英对照翻译、核心结论与阅读笔记。">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<a class="skip" href="#papers">跳到文献列表</a>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="https://www.lymochi.top/"><b>LYMOCHI</b><span class="reg">®</span></a>
    <span class="sep">/</span>
    <span class="sub">LETTER</span>
    <nav class="nav" aria-label="主导航">
      <a href="./" aria-current="page">目录</a>
      <a href="https://www.lymochi.top/">主页</a>
      <a href="https://github.com/Lymochi">GitHub</a>
    </nav>
  </div>
</header>

<main id="main">

  <section class="hero wrap">
    <p class="eyebrow">Reading room <span>·</span> 文献阅读室</p>
    <h1>LETTER<span class="dot">.</span></h1>
    <div class="hero-foot">
      <p class="lede">
        这里放我在读的论文：<em>中英对照的正文</em>、关键结论，以及读完之后自己整理的问题。
        每篇一页，慢慢补。
      </p>
      <div class="counts" aria-label="统计">
        <span><b id="count-all">00</b>收录</span>
        <span><b id="count-done">00</b>已精读</span>
        <span><b id="count-tags">00</b>标签</span>
      </div>
    </div>
  </section>

  <div class="toolbar">
    <div class="wrap toolbar-inner">
      <label class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-3.6-3.6"></path>
        </svg>
        <input id="search" type="search" placeholder="搜索标题、标签…" autocomplete="off" aria-label="搜索文献">
      </label>
      <div class="chips" id="chips" role="group" aria-label="按标签筛选"></div>
    </div>
  </div>

  <section class="list-section wrap" aria-labelledby="list-title">
    <div class="list-head">
      <span id="list-title">目录 / Index</span>
      <span class="hint">新→旧 · 点一行进入阅读</span>
    </div>
    <ol class="papers" id="papers"></ol>
    <p class="empty" id="empty" hidden></p>
  </section>

  <footer class="foot wrap">
    <span>© 2026 Lymochi</span>
    <span>内容持续补充中</span>
    <span class="grow"><a href="https://www.lymochi.top/">← 回到主页</a></span>
  </footer>

</main>

<script src="assets/papers.js"></script>
<script src="assets/index.js"></script>
</body>
</html>
